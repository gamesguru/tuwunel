---
name: Complement Ubuntu 24

on:
  push:
    paths:
      - '.github/workflows/complement-ubuntu24.yml'
      - 'docker/**'
      - 'src/**'
      - 'Cargo.toml'
  pull_request:
    paths:
      - '.github/workflows/complement-ubuntu24.yml'
      - 'docker/**'
      - 'src/**'
      - 'Cargo.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complement:
    name: Complement smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run complement
        env:
          CI: true
          complement_baseline_gate: 0
        run: |
          docker/bake.sh complement-tester complement-testee && docker/complement.sh TestAvatarUrlUpdate
